name: Setup Python
description: Install Python and project dependencies for ga library
inputs:
  python-version:
    description: Python version to use
    required: false
    default: "3.10"
  install-dev:
    description: Install dev dependencies
    required: false
    default: "true"
  install-api:
    description: Install api and docker dependencies
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip

        EXTRAS=""
        if [ "${{ inputs.install-dev }}" = "true" ]; then EXTRAS+="dev,"; fi
        if [ "${{ inputs.install-api }}" = "true" ]; then EXTRAS+="api,"; fi

        if [ -n "$EXTRAS" ]; then
          pip install ".[${EXTRAS%,}]"
        else
          pip install .
        fi