name: CI

on:
  push:
    branches: [ main ]
    paths:
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.py"
      - ".github/**"

  pull_request:
    paths:
      - "**/*.toml"
      - "**/*.yaml"
      - "**/*.py"
      - ".github/**"


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests_pr:
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10" ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Project
        uses: ./.github/actions/setup-python.yml
        with:
          python-version: ${{ matrix.python-version }}
          install-dev: "true"
          install-api: "false"

      - name: Black (check only)
        run: black --check .

      - name: Ruff (linter check)
        run: ruff check .

      - name: MyPy check
        run: |
          python3 -m pip install types-PyYAML
          python3 -m pip install pandas-stubs
          python3 -m pip install types-psutil
          mypy src

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest

  tests_push:
    if: github.event_name == 'push'
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
        python-version: [ "3.10", "3.13" ]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python Project
        uses: ./.github/actions/setup-python.yml
        with:
          python-version: ${{ matrix.python-version }}
          install-dev: "true"
          install-api: "false"

      - name: Pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest

  coverage:
    if: github.event_name == 'push'
    uses: ./.github/workflows/coverage.yml
    permissions:
      contents: write
    with:
      python-version: "3.10"
